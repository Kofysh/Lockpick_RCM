name: Manual Build, Tag and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native build tools
        run: |
          apt-get update
          apt-get install -y build-essential git zip

      - name: Get latest version and compute next tag
        id: version
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git fetch --tags --force

          last_tag=$(git tag --list "2.0.*" --sort=-v:refname | head -n1)

          if [ -z "$last_tag" ]; then
            last_tag="2.0.1"
          fi

          echo "Current version: $last_tag"

          major=$(echo "$last_tag" | cut -d. -f1)
          minor=$(echo "$last_tag" | cut -d. -f2)
          patch=$(echo "$last_tag" | cut -d. -f3)

          next_patch=$((patch + 1))
          version="$major.$minor.$next_patch"

          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the project
        run: make

      - name: Create ZIP package
        run: |
          cd output
          zip -r "../Lockpick_RCM-${{ steps.version.outputs.version }}.zip" .
          cd ..

      - name: Get latest commit message
        id: changelog
        shell: bash
        run: |
          message=$(git log -1 --pretty=%B)

          {
            echo "message<<EOF"
            echo "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tag and push
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="${{ steps.version.outputs.version }}"

          git tag "$version"
          git push origin "$version"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            Changelog:

            ${{ steps.changelog.outputs.message }}
          files: |
            output/Lockpick_RCM.bin
            Lockpick_RCM-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload compiled ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lockpick_RCM-${{ steps.version.outputs.version }}.zip
          path: Lockpick_RCM-${{ steps.version.outputs.version }}.zip
